<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detectives de Radicales Dobles</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#222;--pri:#6741d9;--ok:#2b8a3e;--bad:#c92a2a;--mut:#666}
@media (prefers-color-scheme:dark){:root{--bg:#1b1830;--card:#272344;--tx:#f1f0ff;--pri:#a78bfa;--ok:#69db7c;--bad:#ff8787;--mut:#b9b5d6}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:16px}
.card{background:var(--card);width:100%;max-width:640px;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
h1{margin:0 0 6px;font-size:1.6rem;color:var(--pri)}
p{line-height:1.5}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:10px;background:rgba(128,128,128,.25);border-radius:6px;overflow:hidden;margin:10px 0 18px}
.bar div{height:100%;background:var(--pri);width:0;transition:width .3s}
.q{font-size:1.35rem;font-weight:700;margin:8px 0 16px}
.opt{display:block;width:100%;text-align:left;font-size:1.15rem;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--pri);background:transparent;color:var(--tx);cursor:pointer}
.opt:hover:not(:disabled){background:rgba(124,92,230,.15)}
.opt.ok{border-color:var(--ok);background:rgba(43,138,62,.2)}
.opt.bad{border-color:var(--bad);background:rgba(201,42,42,.2)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:1.05rem;cursor:pointer;margin-top:12px}
.btn:hover{opacity:.9}
.exp{margin-top:12px;padding:12px;border-radius:12px;background:rgba(128,128,128,.15);line-height:1.5}
.big{font-size:3rem;margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="start">
    <h1>🕵️ Detectives de Radicales Dobles</h1>
    <p>Descubre los números secretos escondidos dentro de cada radical. Son 10 casos y puedes jugar las veces que quieras.</p>
    <p class="mut">Pista: busca dos números que <b>sumen</b> lo que está afuera y cuyo <b>producto</b> sea lo que está dentro de la raíz interior.</p>
    <button class="btn" onclick="startGame()">¡Empezar!</button>
  </div>
  <div id="game" class="hide">
    <div class="mut"><span id="num"></span> · Puntos: <b id="score">0</b></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div id="exp" class="exp hide"></div>
    <button class="btn hide" id="next" onclick="next()">Siguiente ➜</button>
  </div>
  <div id="end" class="hide" style="text-align:center">
    <div class="big" id="medal"></div>
    <h1 id="final"></h1>
    <p id="msg"></p>
    <button class="btn" onclick="startGame()">🔁 Jugar otra vez</button>
  </div>
</div>
<script>
const Q=[
{q:"√(7 + 2√10) =",o:["√5 + √2","√7 + √10","7 + √10","√5 − √2"],a:0,e:"Buscamos dos números que sumen 7 y multipliquen 10: son 5 y 2. Entonces √(7+2√10) = √5 + √2."},
{q:"√(9 − 2√14) =",o:["√9 − √14","√7 − √2","√7 + √2","3 − √14"],a:1,e:"Suman 9 y multiplican 14: 7 y 2. Como es una resta, va el mayor primero: √7 − √2."},
{q:"√(8 + 2√12) =",o:["√6 + √2","√8 + √12","2√2 + √3","√4 + √3"],a:0,e:"Suman 8 y multiplican 12: 6 y 2. Resultado: √6 + √2."},
{q:"√(5 + √24) =  (¡cuidado: no hay un 2 delante!)",o:["√5 + √24","√3 + √2","√5 + 2","√12 + √2"],a:1,e:"Primero escribimos √24 = 2√6, así √(5+2√6). Suman 5 y multiplican 6: 3 y 2. Resultado: √3 + √2."},
{q:"√(7 − 4√3) =",o:["√3 − 2","2 − √3","√7 − √3","4 − √3"],a:1,e:"4√3 = 2·(2√3) = 2√12. Suman 7 y multiplican 12: 4 y 3. Sale √4 − √3 = 2 − √3 (el mayor primero, para que sea positivo)."},
{q:"¿Cuál de estos radicales dobles SÍ se puede transformar en radicales simples?",o:["√(5 + √20)","√(7 + √30)","√(7 + √40)","√(6 + √30)"],a:2,e:"Condición: a² − b debe ser cuadrado perfecto. En √(7+√40): 7² − 40 = 9 = 3². ✔ En los demás no sale un cuadrado perfecto."},
{q:"√(7 + 2√10) + √(7 − 2√10) =",o:["14","2√5","2√2","√14"],a:1,e:"Cada uno se transforma: (√5+√2) + (√5−√2). Los √2 se cancelan y queda 2√5."},
{q:"√(3 + 2√2) − √2 =",o:["1","√3","3","0"],a:0,e:"Suman 3 y multiplican 2: 2 y 1. Entonces √(3+2√2) = √2 + 1. Luego (√2 + 1) − √2 = 1."},
{q:"(√(8 + 2√12) − √6) / √2 =",o:["√2","2","1","0"],a:2,e:"√(8+2√12) = √6+√2. Restamos √6 y queda √2. Dividido entre √2 da 1."},
{q:"√(6 − 2√5) + 1 =",o:["√5","√6","5","1"],a:0,e:"Suman 6 y multiplican 5: 5 y 1. √(6−2√5) = √5 − 1. Luego (√5 − 1) + 1 = √5."}
];
let i=0,s=0,order=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(id){["start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function startGame(){i=0;s=0;order=shuffle(Q.map((_,k)=>k));show("game");load()}
function load(){
  const it=Q[order[i]];
  $("num").textContent="Caso "+(i+1)+" de "+Q.length;
  $("score").textContent=s;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("q").textContent=it.q;
  $("exp").classList.add("hide");$("next").classList.add("hide");
  const opts=shuffle(it.o.map((t,k)=>({t,ok:k===it.a})));
  $("opts").innerHTML="";
  opts.forEach(op=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=op.t;
    b.onclick=()=>pick(b,op.ok,it);
    $("opts").appendChild(b);
  });
}
function pick(btn,ok,it){
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===it.o[it.a])b.classList.add("ok")});
  if(ok){s++;$("score").textContent=s}else btn.classList.add("bad");
  $("exp").innerHTML=(ok?"✅ <b>¡Correcto!</b> ":"❌ <b>Casi.</b> ")+it.e;
  $("exp").classList.remove("hide");
  $("next").textContent=i===Q.length-1?"Ver resultado":"Siguiente ➜";
  $("next").classList.remove("hide");
}
function next(){i++;i<Q.length?load():end()}
function end(){
  show("end");
  $("medal").textContent=s>=9?"🏆":s>=7?"🥈":s>=5?"🥉":"💪";
  $("final").textContent=s+" / "+Q.length+" casos resueltos";
  $("msg").textContent=s>=9?"¡Detective experto en radicales!":s>=7?"¡Muy bien! Un repaso más y serás experto.":s>=5?"Vas bien. Repasa la regla de suma y producto y vuelve a intentarlo.":"No te rindas: lee las explicaciones y juega otra vez.";
}
</script>
</body>
</html>
